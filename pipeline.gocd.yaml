format_version: 10
pipelines:
  life_slimming_pipeline:
    group: defaultGroup
    label_template: ${COUNT}
    lock_behavior: none
    display_order: -1
    materials:
      life_slimming_custom_app:
        git: https://gitlab.caratred.com/swathi.bollineni27/life_slimming_custom_app.git
        username: arvind
        shallow_clone: false
        auto_update: true
        branch: master
        polling: false
        encrypted_password: AES:FxycLXutFV5Z5qXK+VmbDg==:iZLBpADdnXaYK7gg299iHQ==
    webhook:
        sslVerificationMode: false
        secret: ""
        pushEvents: true
        tagPushEvents: true
        # Define the URL for the webhook to trigger the pipeline
        url: "https://139.59.81.110:8153/go/api/pipelines/life_slimming_pipeline/schedule"
    stages:
    - life_slimming_app_checkout:
        fetch_materials: true
        keep_artifacts: true
        clean_workspace: false
        approval:
          type: success
          allow_only_on_success: false
        jobs:
          checkout-latest-tag:
            timeout: 0
            environment_variables:
              repo_url: $repo_url
              tag_name: $tag_name
            tasks:
            - exec:
                arguments:
                - -c
                - "/home/erpnext/bench/frappe-bench/apps/life_slimming/deploy.sh" 
                - erpnext
                command: su
                run_if: passed
